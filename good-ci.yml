name: Good CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # ✅ фиксированная версия

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}

      - name: Install project
        run: |
          pip install .            # ✅ build как пакет

  test:
    runs-on: ubuntu-latest
    needs: build                  # ✅ порядок

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          pip install .[dev]

      - name: Run tests
        run: |
          pytest                   # ✅ тесты обязательны

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'   # ✅ только main

    steps:
      - name: Deploy
        run: |
          echo "Deploying application"
